plugins:
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 3.4
  NewCops: enable
  SuggestExtensions: false

Layout/LineLength:
  Max: 120
  # Specs keep upstream's expected Cypher strings and builder chains verbatim.
  Exclude:
    - 'spec/**/*'

Metrics/BlockLength:
  Exclude:
    - 'spec/**/*'
    - '*.gemspec'

# The renderer is one big dispatch over node types; splitting it by cop limits
# would only scatter the grammar.
Metrics/ClassLength:
  Max: 400
# The Cypher module is the facade of factory methods, one line each.
Metrics/ModuleLength:
  Max: 250
  Exclude:
    - 'spec/**/*'
Metrics/MethodLength:
  Max: 20
Metrics/AbcSize:
  Max: 30
Metrics/CyclomaticComplexity:
  Max: 20
Metrics/PerceivedComplexity:
  Max: 20

# Public names mirror the Java API (is_equal_to, is_null, …).
Naming/PredicatePrefix:
  Enabled: false

Style/Documentation:
  Enabled: false

# Specs are translated from upstream test classes and named after them; small
# sibling classes share a file.
RSpec/DescribeClass:
  Enabled: false
RSpec/MultipleDescribes:
  Enabled: false

RSpec/ExampleLength:
  Enabled: false

RSpec/MultipleExpectations:
  Enabled: false

RSpec/NestedGroups:
  Max: 4

RSpec/MultipleMemoizedHelpers:
  Max: 10

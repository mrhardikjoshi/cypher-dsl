plugins:
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 3.4
  NewCops: enable
  SuggestExtensions: false

Layout/LineLength:
  Max: 120
  AllowedPatterns:
    # expected Cypher strings in specs are kept verbatim from upstream
    - '^\s*(expect|to eq|\x27|")'

Metrics/BlockLength:
  Exclude:
    - 'spec/**/*'
    - '*.gemspec'

Metrics/ModuleLength:
  Exclude:
    - 'spec/**/*'

# The renderer is one big dispatch over node types; splitting it by cop limits
# would only scatter the grammar.
Metrics/ClassLength:
  Max: 400
Metrics/MethodLength:
  Max: 20
Metrics/AbcSize:
  Max: 30
Metrics/CyclomaticComplexity:
  Max: 15
Metrics/PerceivedComplexity:
  Max: 15

# Public names mirror the Java API (is_equal_to, is_null, …).
Naming/PredicatePrefix:
  Enabled: false

Style/Documentation:
  Enabled: false

# Specs are translated from upstream test classes and named after them; small
# sibling classes share a file.
RSpec/DescribeClass:
  Enabled: false
RSpec/MultipleDescribes:
  Enabled: false

RSpec/ExampleLength:
  Enabled: false

RSpec/MultipleExpectations:
  Enabled: false

RSpec/NestedGroups:
  Max: 4
